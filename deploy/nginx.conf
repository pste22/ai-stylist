worker_processes auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    # Needed for WebSocket keep-alive through nginx
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        root /app/static;
        index index.html;

        # ── WebSocket bridge ─────────────────────────────────────────────────
        # Vite dev proxy rewrites /mira-ws → / before hitting Python.
        # nginx does the same: strip /mira-ws prefix then upgrade to WS.
        location /mira-ws {
            proxy_pass         http://127.0.0.1:8765/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade         $http_upgrade;
            proxy_set_header   Connection      $connection_upgrade;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;   # 30 min — matches MIRA_MAX_SESSION
            proxy_send_timeout 1800s;
        }

        # ── Avatar token (HTTP, minted server-side) ──────────────────────────
        location /avatar-token {
            proxy_pass http://127.0.0.1:8765/avatar-token;
            proxy_set_header Host $host;
        }

        # ── REST API (browse / filters / review-assist) ───────────────────────
        # Must be before the SPA fallback — otherwise /api/* returns index.html
        # and category chips (Dresses / Tops / …) silently fail to load products.
        location /api/ {
            proxy_pass         http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── React SPA ────────────────────────────────────────────────────────
        # All other routes fall through to index.html for client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively (Vite hashes filenames on each build)
        location ~* \.(js|css|woff2?|png|svg|ico|jpg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
