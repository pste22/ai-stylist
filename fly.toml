# Fly.io deployment config for Mira AI Stylist
# Docs: https://fly.io/docs/reference/configuration/
app = "ai-stylist"
primary_region = "iad"   # US East — lowest latency to Gemini's US endpoints

[build]
  dockerfile = "Dockerfile"

  # Public VITE_ vars baked into the JS bundle at build time.
  # These are non-secret (Supabase anon key + public URL) — safe to commit.
  [build.args]
    VITE_SUPABASE_URL      = "https://tizhjpycyygoysqbxulr.supabase.co"
    VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpemhqcHljeXlnb3lzcWJ4dWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTg3MDcsImV4cCI6MjA5ODU5NDcwN30.uN-ptgBjEY9pdRFNNEzuwYAE-9557pgLcxH4CMdqwRs"
    VITE_HEYGEN_AVATAR_ID  = "Wayne_20240711"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "suspend"  # suspend (not stop) — resumes in ~1s vs ~10s
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100   # max concurrent WebSocket connections per machine
    soft_limit = 80

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
