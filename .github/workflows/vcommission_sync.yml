name: VCommission feed sync

on:
  schedule:
    # Run every day at 2 AM IST (8:30 PM UTC)
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      advertiser:
        description: "Advertiser to sync (leave blank for all)"
        required: false
      dry_run:
        description: "Dry run (no DB writes)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run VCommission importer
        env:
          VC_API_KEY:          ${{ secrets.VC_API_KEY }}
          VC_PUBLISHER_ID:     ${{ secrets.VC_PUBLISHER_ID }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.advertiser }}" ]; then
            ARGS="$ARGS --advertiser ${{ github.event.inputs.advertiser }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python vcommission_importer.py $ARGS
